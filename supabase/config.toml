# Configuración del proyecto Supabase para el CLI / desarrollo local.
# El `project_id` se enlaza con `supabase link --project-ref <ref>`.
project_id = "conciliacion-bancaria"

[api]
# Esquemas expuestos vía PostgREST. `conciliacion` es el esquema del producto.
# En el proyecto hosted hay que exponerlo además en el panel:
# Settings → API → Exposed schemas.
schemas = ["public", "graphql_public", "conciliacion"]
extra_search_path = ["public", "extensions"]

[db]
major_version = 15

[db.migrations]
schema_paths = []

[auth]
# La app web autentica al equipo interno (admin / operador).
enable_signup = false

[storage]
# Buckets privados por tenant para los archivos originales de factura.
enabled = true
