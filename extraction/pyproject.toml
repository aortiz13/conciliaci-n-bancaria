[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conciliacion-extraction"
version = "0.1.0"
description = "Servicio de extracción y validación de facturas (MVP)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["conciliacion_extraction"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
